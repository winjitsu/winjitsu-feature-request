name: Notify Customer

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]

jobs:
  dispatch:
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && !startsWith(github.event.comment.body, '/note')) ||
      (github.event_name == 'issues' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Send Event to API
        env:
          EVENT_CONTEXT: ${{ toJson(github.event) }}
        run: |
          # 1. Filter the raw event to only the fields we need
          echo "$EVENT_CONTEXT" | jq -c '{
            action: .action,
            repository: { name: .repository.name },
            issue: {
              number: .issue.number,
              title: .issue.title,
              html_url: .issue.html_url,
              body: .issue.body
            },
            comment: (if .comment then { body: .comment.body } else null end),
            label: (if .label then { name: .label.name } else null end),
            sender: { type: .sender.type }
          }' > filtered_payload.json

          # 2. Build the final request object
          jq -n --arg ev "${{ github.event_name }}" --slurpfile pl filtered_payload.json \
            '{event: $ev, payload: $pl[0]}' > request.json

          # 3. Securely POST to API
          curl --fail -s -X POST "${{ secrets.GATEWAY_ENDPOINT }}/internal/dispatch-notification" \
            -H "Authorization: Bearer ${{ secrets.GATEWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @request.json
