name: Notify Customer on Feature Shipment

on:
  issues:
    types: [labeled, closed]

jobs:
  notify:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'shipped') ||
      (github.event.action == 'closed')
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Decrypted Metadata from Vault
        id: metadata
        run: |
          TICKET_ID=$(echo "${{ github.event.issue.body }}" | grep -oP '(?<=<!-- ticket_id: )[^>]+(?= -->)' || echo "")
          
          if [ -z "$TICKET_ID" ]; then
            echo "No ticket_id found in issue body. Skipping."
            exit 0
          fi

          # Call API Bridge via Secret URL to bypass Bot Fight Mode
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_AUTH_KEY }}" \
            -H "X-Workflow-Name: ${{ github.workflow }}" \
            -H "Accept: application/json" \
            "${{ secrets.INTERNAL_API_URL }}/internal/ticket-metadata?id=$TICKET_ID")
          
          if [ -z "$RESPONSE" ]; then
             echo "Error: API returned empty response."
             exit 1
          fi

          EMAIL=$(echo "$RESPONSE" | jq -r '.email // empty')
          NAME=$(echo "$RESPONSE" | jq -r '.name // empty')

          if [ -z "$EMAIL" ] || [ "$EMAIL" == "null" ]; then
            echo "Error: Failed to extract email from API response."
            exit 1
          fi

          echo "customer_email=$EMAIL" >> $GITHUB_OUTPUT
          echo "customer_name=$NAME" >> $GITHUB_OUTPUT

      - name: Send shipment email via SMTP2GO
        if: steps.metadata.outputs.customer_email != ''
        env:
          CUSTOMER_NAME: ${{ steps.metadata.outputs.customer_name }}
          CUSTOMER_EMAIL: ${{ steps.metadata.outputs.customer_email }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          CURRENT_YEAR=$(date +'%Y')
          
          # 1. Build the HTML body
          HTML_BODY=$(cat <<HTML
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Feature Request Shipped</title></head>
          <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
            <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:40px 0">
              <tr><td align="center">
                <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                  <tr><td style="background:#0f172a;padding:28px 40px;text-align:center">
                    <img src="https://winjitsu.app/images/logo.png" alt="Winjitsu" width="120" style="display:block;margin:0 auto" />
                  </td></tr>
                  <tr><td style="padding:36px 40px 24px">
                    <h1 style="margin:0 0 8px;font-size:20px;font-weight:600;color:#0f172a">Great news: Your feature is live!</h1>
                    <p style="margin:0 0 24px;font-size:14px;color:#64748b">Hi ${CUSTOMER_NAME}, we've officially shipped the feature you requested.</p>
                    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:28px">
                      <tr><td style="padding:16px 20px">
                        <p style="margin:0 0 4px;font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em">Implemented feature</p>
                        <p style="margin:0;font-size:14px;font-weight:500;color:#0f172a">${ISSUE_TITLE}</p>
                      </td></tr>
                    </table>
                    <table cellpadding="0" cellspacing="0" style="margin-bottom:28px">
                      <tr><td style="background:#0f172a;border-radius:6px">
                        <a href="https://winjitsu.app/release-notes" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:500;color:#ffffff;text-decoration:none">View Release Notes &rarr;</a>
                      </td></tr>
                    </table>
                    <p style="margin:0;font-size:14px;color:#475569">Thank you for helping us make Winjitsu better. Keep the ideas coming!</p>
                  </td></tr>
                  <tr><td style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:20px 40px;text-align:center">
                    <p style="margin:0;font-size:12px;color:#94a3b8">&copy; ${CURRENT_YEAR} Winjitsu &nbsp;&bull;&nbsp; <a href="https://winjitsu.app/privacy" style="color:#94a3b8">Privacy Policy</a></p>
                  </td></tr>
                </table>
              </td></tr>
            </table>
          </body></html>
          HTML
          )

          # 2. Build the text body
          TEXT_BODY=$(cat <<TEXT
          Hi ${CUSTOMER_NAME},
          Great news: We have officially shipped the Winjitsu feature you requested!
          Feature: ${ISSUE_TITLE}
          Link:    ${ISSUE_URL}
          Thank you for helping us make Winjitsu better. You can view the latest release notes at https://winjitsu.app/release-notes
          — Winjitsu Support
          TEXT
          )

          # 3. Combine into JSON payload
          PAYLOAD=$(jq -n \
            --arg api_key "${{ secrets.SMTP2GO_API_KEY }}" \
            --arg to      "$CUSTOMER_EMAIL" \
            --arg sender  "${{ secrets.EMAIL_FROM_ADDRESS }}" \
            --arg subject "Good news: We shipped your feature request! (#${ISSUE_NUMBER})" \
            --arg html    "$HTML_BODY" \
            --arg text    "$TEXT_BODY" \
            '{api_key: $api_key, to: [$to], sender: $sender, subject: $subject, html_body: $html, text_body: $text}')

          # 4. Send
          curl --fail --silent --show-error \
            --url "${{ secrets.SMTP2GO_SEND_URL }}" \
            --header "Content-Type: application/json" \
            --header "X-Smtp2go-Api-Key: ${{ secrets.SMTP2GO_API_KEY }}" \
            --data "$PAYLOAD"
