name: Notify Customer on Comment

on:
  issue_comment:
    types: [created]

jobs:
  notify:
    # Only notify if the comment is NOT a "private note" and NOT from a bot
    # We ignore comments starting with /note or from the bot itself
    if: |
      github.event.comment.user.type != 'Bot' &&
      !startsWith(github.event.comment.body, '/note')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Decrypted Metadata from Vault
        id: metadata
        run: |
          # 1. Extract Ticket ID from hidden HTML comment
          TICKET_ID=$(echo "${{ github.event.issue.body }}" | grep -oP '(?<=<!-- ticket_id: )[^>]+(?= -->)' || echo "")
          
          if [ -z "$TICKET_ID" ]; then
            echo "Error: No ticket_id found in issue body. Skipping notification."
            exit 0
          fi

          # 2. Securely call the Winjitsu API Bridge
          RESPONSE=$(curl --fail --silent --show-error \
            -H "X-Internal-Auth: ${{ secrets.INTERNAL_AUTH_KEY }}" \
            -H "X-Workflow-Name: ${{ github.workflow }}" \
            "https://api.winjitsu.app/internal/ticket-metadata?id=$TICKET_ID")
          
          # 3. Export for next steps
          echo "customer_email=$(echo $RESPONSE | jq -r .email)" >> $GITHUB_OUTPUT
          echo "customer_name=$(echo $RESPONSE | jq -r .name)" >> $GITHUB_OUTPUT

      - name: Send update email via SMTP2GO
        if: steps.metadata.outputs.customer_email != ''
        env:
          CUSTOMER_NAME: ${{ steps.metadata.outputs.customer_name }}
          CUSTOMER_EMAIL: ${{ steps.metadata.outputs.customer_email }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          CURRENT_YEAR=$(date +'%Y')

          # 1. Build the HTML body
          HTML_BODY=$(cat <<HTML
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Update on Feature Request</title></head>
          <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
            <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:40px 0">
              <tr><td align="center">
                <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                  <tr><td style="background:#0f172a;padding:28px 40px;text-align:center">
                    <img src="https://winjitsu.app/images/logo.png" alt="Winjitsu" width="120" style="display:block;margin:0 auto" />
                  </td></tr>
                  <tr><td style="padding:36px 40px 24px">
                    <h1 style="margin:0 0 8px;font-size:20px;font-weight:600;color:#0f172a">Update on your feature request</h1>
                    <p style="margin:0 0 24px;font-size:14px;color:#64748b">Hi ${CUSTOMER_NAME}, there is an update on your request.</p>
                    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:28px">
                      <tr><td style="padding:16px 20px">
                        <p style="margin:0 0 4px;font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em">Update from team</p>
                        <div style="margin:0;font-size:14px;line-height:1.6;color:#0f172a;white-space:pre-wrap">${COMMENT_BODY}</div>
                      </td></tr>
                    </table>
                    <p style="margin:0;font-size:14px;color:#475569">You can track progress on the public roadmap or reply to this email.</p>
                  </td></tr>
                  <tr><td style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:20px 40px;text-align:center">
                    <p style="margin:0;font-size:12px;color:#94a3b8">&copy; ${CURRENT_YEAR} Winjitsu &nbsp;&bull;&nbsp; <a href="https://winjitsu.app/privacy" style="color:#94a3b8">Privacy Policy</a></p>
                  </td></tr>
                </table>
              </td></tr>
            </table>
          </body></html>
          HTML
          )

          # 2. Build the text body
          TEXT_BODY=$(cat <<TEXT
          Hi ${CUSTOMER_NAME},

          There is an update on your Winjitsu feature request (#${ISSUE_NUMBER}).

          MESSAGE:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ${COMMENT_BODY}
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          You can track progress on the public roadmap or reply to this email.

          — Winjitsu Support
          TEXT
          )

          # 3. Combine into JSON payload using jq --arg
          PAYLOAD=$(jq -n \
            --arg api_key "${{ secrets.SMTP2GO_API_KEY }}" \
            --arg to      "$CUSTOMER_EMAIL" \
            --arg sender  "${{ secrets.EMAIL_FROM_ADDRESS }}" \
            --arg subject "Update on your feature request (#${ISSUE_NUMBER})" \
            --arg html    "$HTML_BODY" \
            --arg text    "$TEXT_BODY" \
            '{api_key: $api_key, to: [$to], sender: $sender, subject: $subject, html_body: $html, text_body: $text}')

          # 4. Send and capture response
          RESPONSE=$(curl --fail --silent --show-error \
            --url "${{ secrets.SMTP2GO_SEND_URL }}" \
            --header "Content-Type: application/json" \
            --header "X-Smtp2go-Api-Key: ${{ secrets.SMTP2GO_API_KEY }}" \
            --data "$PAYLOAD")

          echo "SMTP2GO Response: $RESPONSE"
